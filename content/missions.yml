# Mission partners on the "Missions" page, in the order shown.
# "name" is the heading (just the people or organisation); "subtitle" is the line under it
# (their organisation and/or where they are).
# Images live in public/images/missions/. Everything except "name" is optional.
# "links" can point to websites, videos or newsletters (PDFs go in public/docs/missions/).

- name: Marsali Campbell
  subtitle: Pioneers UK
  image: marsali.jpg
  description: |-
    Marsali Campbell, known as ‘Smithton’s missionary,’ served as a nurse missionary in Uganda from 2001 to 2021. From September 2023 to March 2026 Marsali served in Bolivia with Pioneers UK. This was predominantly for immersive Spanish language acquisition, which she successfully achieved. She also helped with a children’s mission, local indigenous community clinic and attended the local church.

    She is presently in Scotland for deputation/leave until the beginning of 2027.

    For contacting Marsali or receiving her newsletter, email [hebrides88@gmail.com](mailto:hebrides88@gmail.com).
  prayer:
    - Thanks to God for having served in Bolivia for over 2 years. Continue to pray for this country as it faces many challenges with political insecurity and economic crisis. Pray that the Church will love the Lord and be salt and light in their families and communities.
    - Thanks to God for the season of home assignment. Marsali has been able to share about God and global mission in many churches and groups, including the WFM annual conference in Glasgow, and also attend a Global Health conference in London. Pray that seeds for mission and ministry have been sown.
    - Marsali is now having some time to rest and she would value prayers for this season.
    - Pray as we have meetings and discussions regarding the next assignment in 2027.
  # A button under the partner's text. Marsali's newsletters are uploaded in the admin panel.
  button:
    title: Read Marsali’s Musings
    url: /missions/marsalis-musings/

- name: Argyris and Dina Petrou
  subtitle: Community House Damaris, Athens, Greece
  image: petrou.jpg
  description: |-
    Argyris was previously the Principal of the Greek Bible College in Athens (the only Bible college in Greece). He still lectures extensively, but has now stepped down from leadership to help provide the ever-increasing logistical support required by the work of Damaris House.

    Dina is the founder and now director of Community House Damaris, a Christian safe house for sexually exploited young women. Damaris also provides a daily recovery programme for the victims of sex trafficking and their children aiming to guide them towards full rehabilitation and reintegration into society.
  prayer:
    - A return visit has been arranged to Damaris House for October 2027. Please pray for all the arrangements that have to be made and that a suitable team would evolve over the coming months.
    - Please pray for the financial stability of Damaris House. The work is highly valued by the government, but receives no funding whatsoever from the Greek authorities. They are solely reliant on donations and are currently running with a deficit of approximately €3000 per month.
  links:
    - title: Watch the latest video
      url: https://vimeo.com/1170727599
    - title: Watch the Petrous’ video update
      url: https://vimeo.com/753326927

- name: Manuel and Alba Franco
  subtitle: Almuñécar, Spain
  image: franco.jpg
  description: |-
    Meet Manuel and Alba Franco, our mission partners in Almuñécar, located in the south of Spain. Together with their son Teo, aged 7, they serve their community fervently.

    Manuel initiated the church two decades ago, witnessing numerous individuals embracing faith throughout the years. Their outreach efforts are diverse, including English classes, Mums and Tots gatherings, weekly radio broadcasts, and distributing Bibles at the local market. Additionally, teams from the UK visit annually to conduct evangelistic activities for local children.

    With a growing congregation, the Francos are actively fundraising for a new church building to accommodate the expanding numbers.
  prayer:
    - Pray for the new people who are coming to the church, for the conversion of the non-believers, and for a good adaptation in our community for the believers.
    - Pray for the children who are coming to the support classes and their families, so that there will also be more new attendance.
  links:
    - title: Watch Manuel’s latest video
      url: https://vimeo.com/1161176362
    - title: European Mission website
      url: http://www.europeanmission.org/missionary/manuel-and-alba-lopez-franco

- name: ‘Adam’
  subtitle: Central Asia
  image: adam.jpg
  description: |-
    Adam’s work is particularly sensitive and it would not be appropriate to provide too many details on a public display.

    ‘Adam’ works with Christians from Central Asia and other refugee groups in the US, Europe and Central Asia. He travels widely to those areas encouraging, teaching, training and bringing practical support to those he meets.

- name: Dan Sempungu
  subtitle: Kisozi Community Church, near Kampala, Uganda
  image: dan.jpg
  description: |-
    Born in 1990 into a Muslim household, Dan faced hardship from a young age, living in Kampala’s slums and streets after his father’s death when he was just 3.

    Supported by Dwelling Places from age 11, Dan received education, support, and Biblical teachings, leading to his own conversion.

    Married to Josephine with four children, he actively leads and evangelises within his church. Recently graduating with a Theology degree, funded by Smithton mission funds, Dan now serves as an assistant Pastor in a church plant located in a predominantly Muslim area outside Kampala.
  prayer:
    - Pray for Dan and Josephine’s son Micah who struggles with sickle cell disease. Please pray Micah continues to respond well to treatment and that the Lord would be close to their family at this time.
    - Pray for Kisozi Community Church, particularly for ongoing provisions and encouragement for those that are training up rural church leaders.
  links:
    - title: Watch Dan’s latest video update
      url: https://vimeo.com/702854370

- name: Merkinch Free Church
  subtitle: Merkinch & South Kessock, Inverness
  image: merkinch.jpg
  description: |-
    Merkinch Free Church is a church plant serving the communities of Merkinch and South Kessock in Inverness. Despite the strong sense of community, this area is now classified by the government as the 8th most deprived area in Scotland.

    This church plant started in 2018 when 20schemes and the Free North Church in Inverness partnered together with Chris Davidson to start this work. By God’s grace, they launched as a church on the 6th of February, 2023.
  prayer:
    - Please remember the work of Merkinch Free Church’s monthly ‘Taste and See’ events as the church seeks to build relationships in the local community. Please pray such events will lead more people to attend the recently begun Hope Explored course.
    - Pray for those involved in the church’s biblical counselling ministry – The Lighthouse Centre – that those who attend would have their lives transformed by Jesus and that the counsellors would be dependent on the Lord’s wisdom and strength.
    - Please remember the church as they look to hire an associate minister. Pray the Lord would provide the right person for this role.
  links:
    - title: Watch the Merkinch video update
      url: https://vimeo.com/753281396

- name: Release International
  subtitle: Voice of Persecuted Christians, in over 25 countries
  image: release.jpg
  description: |-
    Release International is an inter-denominational Christian ministry working through local church partners in more than 25 countries, helping persecuted Christians prayerfully, pastorally and practically. Their ministry is based on Hebrews 13v3: ‘Continue to remember those in prison as if you were together with them in prison, and those who are mistreated as if you yourselves were suffering.’

    They were founded in 1968, inspired by the testimony and ministry of Pastor Richard Wurmbrand, who was imprisoned for his faith for 14 years in communist Romania.
  prayer:
    - Give thanks for the recent trauma healing workshop and the profound impact it made on the lives of those who attended.
    - Pray for continued healing, emotional and spiritual strength.
    - Pray for the safety of Stefanos’ staff who travel all over the country to conduct workshops.
  links:
    - title: releaseinternational.org
      url: http://www.releaseinternational.org

- name: Suraj Kasula
  subtitle: Shekinah Evangelical Church, Bhaktapur, Nepal
  image: suraj.jpg
  description: |-
    Suraj Kasula is the pastor of Shekinah Evangelical Church in Bhaktapur, Nepal, and a lecturer at Bhaktapur Theological Seminary. He is dedicated to making the seminary a centre for reformed theology in Nepal and is involved in constructing a multi-storey building for the church and seminary. Suraj is also active in supporting church plants in Eastern Nepal, providing essential aid and fostering inclusive worship communities. Alongside his wife Roshani and their two daughters, Hadassah and Esther, he works tirelessly to spread the gospel and support his community amidst challenging conditions.

    Suraj has travelled to the site of the recent tragic Nepal flooding, to see how he, his church and others can help.
  prayer:
    - Pray for the “Ask Pastor” podcast on YouTube and Facebook where Suraj seeks to answer theological questions from Christians across Nepal.
    - Pray that the funds will continue to arrive to complete the Residential block of the Seminary.
    - Pray for the work of translating important Christian works into the Nepali language.
  links:
    - title: Watch Suraj’s latest video update
      url: https://youtu.be/MlJUXyQDsBc
    - title: Church Facebook page
      url: http://www.facebook.com/MilanChurch

- name: Wakisa Ministries
  subtitle: Uganda
  image: wakisa.jpg
  description: |-
    Wakisa is a pregnancy crisis centre focused on love, faith, and hope in the heart of Uganda. At its core, Wakisa stands for “The promotion of dignity and self esteem of young girls in Uganda with crisis pregnancy while addressing their emotional, physical and spiritual well being. This is achieved by providing temporary shelter, counselling and care services, providing opportunities for Christian growth and discipleship and equipping them with life and vocational skills, thus transforming lives of this vulnerable group.”
  prayer:
    - Pray for the salvation of the girls and to know Christ as their Lord and Saviour.
    - Pray for the successful completion of the new Medical centre.
    - Pray for the raising of funds to build the Administration block so the staff offices can be moved from the girls dormitory.
    - Pray for a competent person to serve as the next director when Vivian retires.
  links:
    - title: Watch the latest Wakisa video update
      url: https://vimeo.com/1155506449
    - title: wakisaministries.com
      url: http://www.wakisaministries.com

- name: Dwelling Places
  subtitle: Uganda
  image: dwelling-places.jpg
  description: |-
    Dwelling Places began in 2002 and is a Christian NGO dedicated to the rescue and rehabilitation of street children, abandoned babies and high-risk slum families in Uganda.

    Dwelling Places follows a holistic program to restore and rebuild the children and families in its care. The ‘Restore’ program is dedicated to rescuing vulnerable children and rehabilitating them through healthcare, education and reconciliation with their families, helping them to welcome their children back into the home, and to enable alumni to develop and enjoy a sustainable way of life after leaving Dwelling Places.
  prayer:
    - Pray for the provision of resources for our Transitional Rehabilitation Home. Dwelling Places would like to take on at least 100 girls and effectively rehabilitate them but they are limited by resources.
    - Pray that all of the families of these precious children will be found and there will be successful reconciliation and reintegration.
    - Pray for the staff who are at the forefront of this work to have the wisdom, patience, compassion and love for the children as they serve, especially during the Rehabilitation Process.
  links:
    - title: Watch Dwelling Places’ latest video update
      url: https://youtu.be/wMSkh6Jlc28
    - title: dwellingplaces.org
      url: http://www.dwellingplaces.org/

- name: Christian Solidarity Worldwide (CSW)
  subtitle: Africa, Asia, Latin America & the Middle East
  image: csw.jpg
  description: |-
    CSW’s team of specialist advocates operates in over 20 countries across Africa, Asia, Latin America, and the Middle East, dedicated to upholding and safeguarding the right to freedom of religion or belief. Their vision is a world free from religious persecution, where everyone can freely practise their chosen religion or belief. Embracing CSW’s Christian heritage, identity, and values, which underpin all their endeavours, CSW firmly believes in the transformative power of prayer.
  prayer:
    - Pray for the Christians in India that have been violently attacked on account of their beliefs and for refusing to renounce their Christian faith.
    - Pray for the people of Nicaragua as they face growing violations of their freedom of religion or belief, as highlighted in the recent report by CSW.
    - Lift up the religious groups in China who are being increasingly targeted by authorities, with a rising number facing criminal prosecution.
  links:
    - title: Watch CSW’s latest video update
      url: https://vimeo.com/657799673
    - title: csw.org.uk
      url: http://www.csw.org.uk

- name: Cheptebo Rural Development Centre
  subtitle: Kerio Valley, Kenya
  image: cheptebo.jpg
  description: |-
    Set in the beautiful Kerio Valley of Western Kenya, the Cheptebo Rural Development Centre stands as a testimony to God’s faithfulness. Started in 1986 under the auspices of Africa Inland Mission to promote the spiritual and physical welfare of the community, it now features a demonstration farm and animal husbandry skills to aid sustainable agriculture. The centre also includes a conference facility for 100 guests and a new residential.
  prayer:
    - Pray that the ongoing work at the Cheptebo Agricultural and Innovation Centre continues to progress smoothly and that the students from other colleges in Kenya benefit greatly from their attachments, further enhancing the centre’s reputation.
    - Pray for wisdom and guidance for the leadership of the Cheptebo Rural Development Centre as they implement their new five-year strategic plan. Pray that their work continues to spread the gospel and show the love of Jesus in the Rift Valley.
    - Pray for the two new churches planted in Torok and Kuber, and that the recent evangelism outreach events bear fruit. Pray especially that more local people, particularly young men who are difficult to reach, will be connected to their local church.
  links:
    - title: Watch Cheptebo’s latest video update
      url: https://www.youtube.com/watch?v=_zXbAze0yWs
    - title: cheptebo.org
      url: http://www.cheptebo.org

- name: Invergordon Seafarers Centre
  subtitle: Port of Invergordon
  image: seafarers.jpg
  description: |-
    The Invergordon Seafarers Centre, led by Port Chaplain Drew Anderson and his wife Liz, assisted by volunteers, welcomes thousands of crew members annually. The centre provides tea, coffee, shortbread, woollen hats, internet access, pastoral care, and warm clothing, while gifting Bibles and booklets in multiple languages. Crew members on incoming vessels also receive parcels with essential items and a New Testament in their native language, which are gratefully received.
  prayer:
    - Pray for the crew members that need help and support to be able to get ashore.
    - Pray for guidance and wisdom when dealing with sensitive/spiritual matters.
    - Pray for the families at home, separated from loved ones, many for up to ten months.
  links:
    - title: sailors-society.org
      url: https://www.sailors-society.org/

# People shown on the "Meet The Team" page.
# Photos live in public/images/team/ — square photos look best (about 400 x 400 pixels).
# "role", "bio" and "email" are optional.

ministry:
  - name: Alasdair Macleod
    role: Minister
    photo: alasdair-macleod.jpg
  - name: Davi de Paula
    role: Assistant Minister
    photo: davi-de-paula.jpg
  - name: Ian Hamilton
    role: Associate Minister
    photo: ian-hamilton.jpg
    bio: >-
      After serving congregations in Ayrshire and Cambridge, Ian joined the Smithton team as an
      Associate Minister in 2017. An accomplished writer, Ian edits the Banner of Truth magazine.
      He also lectures part-time in Greenville Presbyterian Theological Seminary in the USA.
  - name: Ali MacDonald
    role: Pastoral Worker
    photo: ali-macdonald.jpg
    bio: >-
      Ali is a pastoral worker, committed to spending time with folk in the church and the
      community, bringing God’s promises of help, care and comfort, into the variety of situations
      that confront men, women and young people on a daily basis.
    email: alimacdonald@smithtonchurch.com

support:
  - name: Anne Rodgers
    role: Church Manager
    photo: anne-rodgers.jpg
    bio: >-
      Anne joined the team in late 2018 as Church Manager, overseeing all the administrative
      functions of the congregation.
    email: office@smithtonchurch.com
  - name: Euan Anderson
    role: Church Office
    photo: euan-anderson.jpg
    bio: >-
      Euan supports the smooth running of the church, assisting with its administration and the
      day-to-day management of its facilities.
    email: office@smithtonchurch.com
  - name: Joey Smith
    role: Church Caretaker
    photo: joey-smith-caretaker.jpg
    bio: >-
      Joey serves as a deacon here at Smithton and is also our church caretaker. Joey looks after
      the building, making sure that all of the facilities are in great working order.
    email: office@smithtonchurch.com
    email_note: FAO Joey
  - name: Eric Halkett
    role: Gift Aid Co-ordinator
    photo: eric-halkett.jpg
    bio: >-
      Eric works part-time in the church office assisting with finances and database needs.
    email: office@smithtonchurch.com
    email_note: FAO Eric

